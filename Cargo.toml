[package]
name = "monitor-rust"
version = "0.1.0"
edition = "2021"
description = "Pannello compatto per i sensori di LibreHardwareMonitor: temperature, ventole, GPU"
publish = false

[[bin]]
name = "monitor-rust"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "persistence", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
lto = "thin"
